const SUPABASE_URL = 'https://dedklmuajccbdltmpazi.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_GJrtgv94mcNhbsvDIyhzsg_50XDws3a';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
let supabaseReady = SUPABASE_URL.startsWith('https://') && !SUPABASE_URL.includes('PEGA_AQUI') && !SUPABASE_PUBLISHABLE_KEY.includes('PEGA_AQUI');

function dbProductToLocal(r){
  return {id:String(r.id),n:r.nombre||'',d:r.descripcion||'',c:r.categoria||'Ropa',p:Number(r.precio)||0,i:r.imagen_url||''};
}
async function loadProductsFromSupabase(){
  if(!supabaseReady)return;
  const {data,error}=await sb.from('Productos').select('*').order('created_at',{ascending:false});
  if(error){console.error(error);toast('No se pudieron cargar los productos de Supabase');return;}
  S.products=(data||[]).map(dbProductToLocal);
  draw();
}
async function saveProductToSupabase(localProduct, existingId){
  if(!supabaseReady){toast('Falta configurar Supabase en el archivo');return false;}
  const row={nombre:localProduct.n,precio:Number(localProduct.p),categoria:localProduct.c,descripcion:localProduct.d||'',imagen_url:localProduct.i||''};
  let result;
  if(existingId){
    result=await sb.from('Productos').update(row).eq('id',Number(existingId)).select().single();
  }else{
    result=await sb.from('Productos').insert(row).select().single();
  }
  if(result.error){console.error(result.error);toast('Supabase: '+result.error.message);return false;}
  return result.data;
}
async function deleteProductFromSupabase(id){
  if(!supabaseReady){toast('Falta configurar Supabase en el archivo');return false;}
  const {error}=await sb.from('Productos').delete().eq('id',Number(id));
  if(error){console.error(error);toast('Supabase: '+error.message);return false;}
  return true;
}

let S=JSON.parse(document.getElementById('d').textContent);
const $=s=>document.querySelector(s),cop=n=>'$'+Math.round(n).toLocaleString('es-CO');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let view='home',cat='Todos',cart=ls.get('lq_cart',[]),adm=false,edit=null,img='';
try{adm=sessionStorage.getItem('lq_adm')==='1'}catch(e){}
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
function toast(m){const t=$('#t');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3200)}
async function save(msg){
  const c=document.documentElement.cloneNode(true);
  c.querySelector('#app').innerHTML='';c.querySelector('#t').style.display='none';
  c.querySelectorAll('script').forEach(s=>{if(s.id!=='d'&&s.id!=='js')s.remove()});
  c.querySelector('#d').textContent=JSON.stringify(S).replace(/</g,'\\u003c');
  try{const a=await claude.use('artifact');if(!a)throw 0;await a.publish('<!DOCTYPE html>\n'+c.outerHTML);toast(msg||'Guardado')}
  catch(e){toast('Solo el dueño de la página puede guardar cambios')}
}
function nav(){return `<nav><div class="logo"><i>✨</i>LO QUIERO</div>
<button class="${view=='home'||view=='cat'?'on':''}" onclick="go('cat')">Catálogo</button>
<button class="${view=='cart'?'on':''}" onclick="go('cart')">🛒 Carrito${cart.length?' ('+cart.reduce((a,b)=>a+b.q,0)+')':''}</button>
${adm?'':`<button class="${view=='adm'?'on':''}" onclick="go('adm')">Admin</button>`}</nav>`}
function go(v){view=v;edit=null;img='';draw();scrollTo(0,0)}
function card(p){return `<div class="card"><div class="im" style="${p.i?`background-image:url(${p.i})`:''}">${p.i?'':'🛍️'}</div><div class="bd"><small>${esc(p.c)}</small><h3>${esc(p.n)}</h3><div class="d">${esc(p.d)}</div><div class="pr">${cop(p.p)}</div><button class="btn" style="margin-top:auto" onclick="add('${p.id}')">Añadir al Carrito</button></div></div>`}
function add(id){const x=cart.find(c=>c.id==id);x?x.q++:cart.push({id,q:1});ls.set('lq_cart',cart);toast('Añadido al carrito');draw(1)}
function home(){return `<div class="hero"><span class="badge">✨ Colección Premium 2026</span><h1>LO QUIERO</h1><em>Lo ves, Lo amas, ¡LO QUIERO!</em><p>Tu tienda premium de ropa, perfumería y papelería</p>
<button class="btn" onclick="go('cat')">Explorar Catálogo</button> <button class="btn o" onclick="document.querySelector('.cats').scrollIntoView({behavior:'smooth'})">Conocer Más</button>
<div class="cats">${CATS.map((c,i)=>`<div class="cat c${i}" onclick="cat='${c[0]}';go('cat')"><span>${c[1]}</span><b>${c[0]}</b><small>${c[2]}</small></div>`).join('')}</div></div>`}
function catalog(){const l=S.products.filter(p=>cat=='Todos'||p.c==cat);
return `<div class="pills">${['Todos',...CATS.map(c=>c[0])].map(c=>`<button class="pill ${c==cat?'on':''}" onclick="cat='${c}';draw()">${c=='Todos'?c:CATS.find(x=>x[0]==c)[1]+' '+c}</button>`).join('')}</div>
${l.length?`<div class="grid">${l.map(card).join('')}</div>`:'<p class="mu">Aún no hay productos en esta categoría.</p>'}`}
function items(){return cart.map(c=>({...S.products.find(p=>p.id==c.id),q:c.q})).filter(x=>x.id)}
function cartV(){const it=items(),t=it.reduce((a,b)=>a+b.p*b.q,0);
return `<div class="box s"><h2>Mi Carrito</h2>${it.length?it.map(x=>`<div class="row">${x.i?`<img src="${x.i}">`:'<div class="ph">🛍️</div>'}<div class="g"><b>${esc(x.n)}</b><br>${cop(x.p)}</div><div class="q"><button onclick="qty('${x.id}',-1)">−</button>${x.q}<button onclick="qty('${x.id}',1)">+</button></div></div>`).join('')+`<div class="tot"><span>Total</span><span>${cop(t)}</span></div><label>Tu nombre</label><input id="nm" placeholder="Nombre" value="${esc(ls.get('lq_nm',''))}"><label>Tu teléfono</label><input id="tl" inputmode="tel" placeholder="Teléfono"><button class="btn sq" onclick="order()">Enviar pedido por WhatsApp</button>`:`<p class="mu" style="color:var(--pr2)">Tu carrito está vacío</p>`}<button class="btn sq" style="margin-top:10px" onclick="go('cat')">Continuar comprando</button></div>`}
function qty(id,d){const x=cart.find(c=>c.id==id);x.q+=d;if(x.q<1)cart=cart.filter(c=>c!=x);ls.set('lq_cart',cart);draw(1)}
function order(){const it=items(),nm=$('#nm').value.trim(),tl=$('#tl').value.trim();if(!nm)return toast('Escribe tu nombre');
const t=it.reduce((a,b)=>a+b.p*b.q,0);ls.set('lq_nm',nm);
const o={id:Date.now().toString(36),name:nm,phone:tl,items:it.map(x=>({n:x.n,p:x.p,q:x.q})),total:t,ts:Date.now(),st:'p'};
ls.set('lq_pend',[...ls.get('lq_pend',[]),o]);
const msg=`Hola, soy ${nm}. Quisiera:\n\n`+it.map(x=>`• ${x.n}${x.q>1?' x'+x.q:''}: ${cop(x.p*x.q)}`).join('\n')+`\n\nTotal: ${cop(t)}`;
let n=String(S.wa).replace(/\D/g,'');if(n.length==10)n='57'+n;
cart=[];ls.set('lq_cart',cart);window.open('https://wa.me/'+n+'?text='+encodeURIComponent(msg),'_blank');draw(1)}
function login(){return `<div class="box l"><h2>Panel de Administración</h2><label>Contraseña</label><input id="pw" type="password" placeholder="Ingresa la contraseña" onkeydown="if(event.key=='Enter')ent()"><button class="btn sq" onclick="ent()">Ingresar</button></div>`}
async function ent(){if(await sha($('#pw').value)===S.ph){adm=true;try{sessionStorage.setItem('lq_adm','1')}catch(e){}draw()}else toast('Contraseña incorrecta')}
function out(){adm=false;try{sessionStorage.removeItem('lq_adm')}catch(e){}go('home')}
function pend(){return [...S.orders.filter(o=>o.st=='p'),...ls.get('lq_pend',[]).filter(o=>!S.orders.some(x=>x.id==o.id))]}
function ordCard(o,p){return `<div class="ord ${p?'p':''}"><b>${esc(o.name)}</b><br>${o.phone?`<a href="tel:${esc(o.phone)}">${esc(o.phone)}</a><br>`:''}📦 ${o.items.reduce((a,b)=>a+b.q,0)} producto(s)<br>Total: ${cop(o.total)}<br><small>${new Date(o.ts).toLocaleDateString('es-CO')}</small>
<details style="margin:8px 0">${o.items.map(i=>`<div>${esc(i.n)} x${i.q} — ${cop(i.p*i.q)}</div>`).join('')}<summary>Ver Detalles</summary></details>
${p?`<button class="btn grn sm" onclick="acc('${o.id}',1)">Aceptar</button> <button class="btn red sm" onclick="acc('${o.id}',0)">Rechazar</button>`:''}</div>`}
function acc(id,ok){let o=pend().find(x=>x.id==id);S.orders=S.orders.filter(x=>x.id!=id);if(ok){o.st='c';o.ts=o.ts||Date.now();S.orders.push(o)}
ls.set('lq_pend',ls.get('lq_pend',[]).filter(x=>x.id!=id));save(ok?'Pedido aceptado':'Pedido rechazado')}
function manual(){const name=prompt('Nombre del cliente');if(!name)return;const total=+prompt('Total del pedido (COP)');if(!total)return;
S.orders.push({id:Date.now().toString(36),name,phone:prompt('Teléfono (opcional)')||'',items:[{n:'Pedido manual',p:total,q:1}],total,ts:Date.now(),st:'p'});save('Pedido registrado')}
function dash(){const d=new Date(),m=S.orders.filter(o=>o.st=='c'&&new Date(o.ts).getMonth()==d.getMonth()&&new Date(o.ts).getFullYear()==d.getFullYear());
const v=m.reduce((a,b)=>a+b.total,0),dm=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),days=Array(dm).fill(0);m.forEach(o=>days[new Date(o.ts).getDate()-1]+=o.total);
const mx=Math.max(...days,1),tp={};m.forEach(o=>o.items.forEach(i=>tp[i.n]=(tp[i.n]||0)+i.q));const top=Object.entries(tp).sort((a,b)=>b[1]-a[1])[0],pc=S.goal?Math.min(100,v/S.goal*100):0;
return `<div class="box pn"><h2>Progreso de ${d.toLocaleDateString('es-CO',{month:'long'})}</h2><div class="kp"><div>Ventas<b>${cop(v)}</b></div><div>Pedidos aceptados<b>${m.length}</b></div><div>Ticket promedio<b>${cop(m.length?v/m.length:0)}</b></div><div>Pendientes<b>${pend().length}</b></div></div>
${top?`<p>Más pedido: <b>${esc(top[0])}</b> (${top[1]})</p>`:''}
<label>Meta del mes (COP)</label><input id="gl" inputmode="numeric" value="${S.goal||''}" placeholder="Ej: 2000000" onchange="S.goal=+this.value||0;save('Meta guardada')">
${S.goal?`<div class="bar"><i style="width:${pc}%"></i></div><small>${pc.toFixed(0)}% de la meta</small>`:''}
<div class="days">${days.map((x,i)=>`<i title="Día ${i+1}: ${cop(x)}" style="height:${x/mx*100}%"></i>`).join('')}</div></div>`}

return `<div class="box pn"><h2>${edit?'Editar':'Añadir'} Producto</h2><input id="pn" placeholder="Nombre del producto" value="${esc(p.n)}"><textarea id="pd" rows="2" placeholder="Descripción del producto">${esc(p.d)}</textarea>
<select id="pc">${CATS.map(c=>`<option ${c[0]==p.c?'selected':''}>${c[0]}</option>`).join('')}</select><input id="pp" inputmode="numeric" placeholder="Precio" value="${p.p}">
<label class="up" id="upl"><input type="file" accept="image/*" hidden onchange="pick(this)">${img?`<img src="${img}">`:'⬆️<br>Haz clic para subir imagen<br><small>PNG, JPG, GIF</small>'}</label>
<button class="btn sq" onclick="saveP()">${edit?'Guardar cambios':'Añadir Producto'}</button>${edit?`<button class="btn sq" style="margin-top:8px;background:#999" onclick="go('adm')">Cancelar</button>`:''}</div>`}
function pick(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);img=c.toDataURL('image/jpeg',.8);$('#upl').innerHTML=`<input type="file" accept="image/*" hidden onchange="pick(this)"><img src="${img}">`};im.src=r.result};r.readAsDataURL(f)}
async function saveP(){
  const n=$('#pn').value.trim(),p=+$('#pp').value;
  if(!n||!p)return toast('Nombre y precio son obligatorios');
  if(!supabaseReady)return toast('Primero configura las claves de Supabase en este archivo');
  const o={n,d:$('#pd').value.trim(),c:$('#pc').value,p,i:img||''};
  const saved=await saveProductToSupabase(o,edit);
  if(!saved)return;
  if(edit){
    const x=S.products.find(x=>x.id==String(edit));
    if(x)Object.assign(x,dbProductToLocal(saved));
  }else{
    S.products.unshift(dbProductToLocal(saved));
  }
  edit=null;img='';draw();
  toast('Producto guardado en Supabase');
}
async function del(id){
  if(!confirm('¿Eliminar este producto?'))return;
  const ok=await deleteProductFromSupabase(id);
  if(!ok)return;
  S.products=S.products.filter(p=>String(p.id)!=String(id));
  draw();
  toast('Producto eliminado de Supabase');
}
function ed(id){edit=id;img='';draw();scrollTo(0,0)}
function cfg(){return `<div class="box pn"><h2>Ajustes</h2><label>Número de WhatsApp (recibe los pedidos)</label><input id="wa" inputmode="tel" value="${esc(S.wa)}"><button class="btn sq" onclick="S.wa=$('#wa').value.replace(/\\D/g,'');save('WhatsApp actualizado')">Guardar número</button>
<label style="margin-top:16px">Cambiar clave</label><input id="p1" type="password" placeholder="Clave actual"><input id="p2" type="password" placeholder="Nueva clave (mín. 6 caracteres)"><button class="btn sq" onclick="chpw()">Cambiar clave</button></div>`}
async function chpw(){if(await sha($('#p1').value)!==S.ph)return toast('La clave actual no coincide');const n=$('#p2').value;if(n.length<6)return toast('La nueva clave es muy corta');S.ph=await sha(n);save('Clave cambiada')}
function admin(){const h=S.orders.filter(o=>o.st=='c').sort((a,b)=>b.ts-a.ts),pe=pend();
return `<div class="top"><h1>Panel de Administración</h1><button class="btn red sm" onclick="out()">Cerrar Sesión</button></div>${dash()}${prodForm()}
<div class="box pn"><h2>Productos (${S.products.length})</h2>${S.products.map(p=>`<div class="row">${p.i?`<img src="${p.i}">`:'<div class="ph">🛍️</div>'}<div class="g"><b>${esc(p.n)}</b><br><small>${cop(p.p)} · ${esc(p.c)} ${p.i?'✓ Con imagen':'· Sin imagen'}</small></div><button class="pill" onclick="ed('${p.id}')">Editar</button><button class="pill" style="color:#dc2626;border-color:#dc2626" onclick="del('${p.id}')">🗑</button></div>`).join('')}</div>
<div class="box pn" style="background:#fdf9f2"><div class="top" style="margin:0"><h2 style="color:#1e1b2e">Pedidos Pendientes (${pe.length})</h2><button class="btn sm" onclick="manual()">+ Registrar</button></div>${pe.length?pe.map(o=>ordCard(o,1)).join(''):'<p style="color:var(--pr2)">No hay pedidos pendientes</p>'}</div>
<div class="box pn" style="background:#f3f8f6"><h2 style="color:#1e1b2e">Pedidos Confirmados (${h.length})</h2>${h.map(o=>ordCard(o,0)).join('')||'<p class="mu">Sin historial aún</p>'}</div>${cfg()}`}
function draw(keep){const y=scrollY;$('#app').innerHTML=nav()+'<main>'+(view=='home'?home()+'':view=='cat'?catalog():view=='cart'?cartV():adm?admin():login())+'</main>';if(keep)scrollTo(0,y)}
document.querySelector('#app').addEventListener('click',()=>{});
draw();
if(supabaseReady) loadProductsFromSupabase();
</script>
</body></html>
